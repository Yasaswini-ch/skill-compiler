<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trace Viewer</title>
<link rel="stylesheet" href="style.css">
<script src="mock/mock.js"></script>
<script src="data/data.js"></script>
<script src="common.js"></script>
</head>
<body>
<main>
  <p class="kicker">Run trace</p>
  <h1>Trace viewer</h1>
  <p class="sub">See one run step by step: what each attempt said, what the checker answered, and where a retry fixed it.</p>
  <div class="card boxed" id="drop">
    <label>Load a trace.json: <input type="file" id="file" accept=".json,application/json"></label>
    <span class="hint"> or drag a file onto this box, or open this page with <code>?file=path/to/trace.json</code>.</span>
  </div>
  <p id="msg" class="err"></p>
  <div id="out"></div>
</main>
<script>
nav("trace.html");
const out = document.getElementById("out"), msg = document.getElementById("msg");

function show(trace, note) {
  msg.textContent = "";
  if (!trace || typeof trace !== "object" || !("steps" in trace)) { msg.textContent = "That does not look like a trace.json (no steps field)."; return; }
  mockBanner(trace.mock === true, "MOCK TRACE - produced by a stand-in, not the real harness");
  out.replaceChildren(el("p", { class: "hint" }, note || ""));
  const box = el("div"); out.append(box);
  renderTrace(trace, box, { replay: true });
}
function readFile(f) {
  const r = new FileReader();
  r.onload = () => { try { show(JSON.parse(r.result), "Loaded " + f.name); } catch (e) { msg.textContent = "Not valid JSON: " + e.message; } };
  r.readAsText(f);
}
document.getElementById("file").addEventListener("change", e => e.target.files[0] && readFile(e.target.files[0]));
const drop = document.getElementById("drop");
drop.addEventListener("dragover", e => { e.preventDefault(); drop.style.outline = "3px dashed var(--ink)"; });
drop.addEventListener("dragleave", () => drop.style.outline = "");
drop.addEventListener("drop", e => { e.preventDefault(); drop.style.outline = ""; if (e.dataTransfer.files[0]) readFile(e.dataTransfer.files[0]); });

(async function () {
  const q = new URLSearchParams(location.search).get("file");
  if (q) {
    // Only relative paths on this origin: no scheme (http:, data:...), no protocol-relative or backslash tricks.
    const relative = !/^[a-z][a-z0-9+.-]*:/i.test(q) && !/^[\\/]{2}/.test(q) && !q.startsWith("\\") && new URL(q, location.href).origin === location.origin;
    if (!relative) { msg.textContent = "?file= must be a relative path on this site. Use the file picker for other files."; return; }
    try { const r = await fetch(q); if (!r.ok) throw new Error(r.status + " " + r.statusText); return show(await r.json(), "Loaded " + q); }
    catch (e) { msg.textContent = `Could not fetch ${q} (${e.message}). On a local folder, use the file picker instead.`; }
  }
  try { const { data, source } = await loadJSON("trace.json"); show(data, `Showing the ${source} sample trace.`); }
  catch (e) { out.append(el("div", { class: "empty" }, "Choose a trace.json to begin.")); }
})();
</script>
</body>
</html>
